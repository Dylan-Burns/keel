name: deploy-aws

# Manual, approved deploy of a released image to the AWS pilot host (D-39).
# The production environment in GitHub requires a reviewer before the job
# runs. The job assumes the deploy role through GitHub OIDC (no stored AWS
# key), bundles the deploy files of the release commit into the S3 bucket,
# and runs infra/deploy_host.sh from that bundle on the instance through SSM
# Run Command, so no SSH port is open and the host needs no GitHub access. The
# role trusts only jobs of the production environment, which requires the
# engineer's approval and runs only from protected branches.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to deploy, for example 0.3.1"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: ${{ vars.KEEL_PUBLIC_URL }}
    steps:
      - name: check the version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 1.2.3"
            exit 1
          fi
      - name: check out the release
        uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: run the deploy script on the host
        env:
          VERSION: ${{ inputs.version }}
          INSTANCE_ID: ${{ vars.KEEL_INSTANCE_ID }}
          BUCKET: ${{ vars.TF_BACKUP_BUCKET }}
        run: |
          # The repository is private, so the host fetches nothing from
          # GitHub: the job bundles the deploy files of the release commit,
          # puts them in the S3 bucket, and the host runs the bundled script.
          sha="$(git rev-parse HEAD)"
          echo "v${VERSION} is ${sha}"
          tar czf bundle.tgz docker-compose.yml infra/Caddyfile infra/backup.sh \
            infra/deploy_host.sh infra/systemd
          key="keel/deploy/${VERSION}-${sha}.tgz"
          aws s3 cp --only-show-errors bundle.tgz "s3://${BUCKET}/${key}"
          # SSM runs the commands with /bin/sh, so the script itself runs under
          # bash (it sets -euo pipefail) and 1 line chains the steps.
          params="$(jq -n --arg src "s3://${BUCKET}/${key}" --arg version "${VERSION}" '{
            commands: [
              "mkdir -p /tmp/keel_bundle && cd /tmp/keel_bundle && /snap/bin/aws s3 cp --only-show-errors \($src) bundle.tgz && tar xzf bundle.tgz && bash infra/deploy_host.sh \($version) /tmp/keel_bundle"
            ],
            executionTimeout: ["3000"]
          }')"
          command_id="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "keel deploy ${VERSION}" \
            --parameters "${params}" \
            --query Command.CommandId --output text)"
          echo "SSM command ${command_id}"
          status=Pending
          for _ in $(seq 1 600); do
            status="$(aws ssm get-command-invocation \
              --command-id "${command_id}" --instance-id "${INSTANCE_ID}" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "${status}" in
              Pending|InProgress|Delayed) sleep 5 ;;
              *) break ;;
            esac
          done
          aws ssm get-command-invocation \
            --command-id "${command_id}" --instance-id "${INSTANCE_ID}" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          if [[ "${status}" != "Success" ]]; then
            echo "::error::the deploy ended with ${status}"
            exit 1
          fi
      - name: smoke test over HTTPS
        env:
          HOST: ${{ vars.KEEL_HOSTNAME }}
          PUBLIC_URL: ${{ vars.KEEL_PUBLIC_URL }}
          VERSION: ${{ inputs.version }}
        run: |
          # The host itself (Caddy), then the public CloudFront address.
          curl -fsS "https://${HOST}/api/health" | grep -q "\"${VERSION}\""
          curl -fsS "${PUBLIC_URL}/api/health" | grep -q "\"${VERSION}\""
          curl -fsS "${PUBLIC_URL}/api/ready"
