name: deploy-aws

# Manual, approved deploy of a released image to the AWS pilot host (D-39).
# The production environment in GitHub requires a reviewer before the job
# runs. The job assumes the deploy role through GitHub OIDC (no stored AWS
# key) and runs infra/deploy_host.sh of the release tag on the instance
# through SSM Run Command, so no SSH port is open to GitHub.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to deploy, for example 0.3.1"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://${{ vars.KEEL_HOSTNAME }}
    steps:
      - name: check the version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 1.2.3"
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: run the deploy script on the host
        env:
          VERSION: ${{ inputs.version }}
          INSTANCE_ID: ${{ vars.KEEL_INSTANCE_ID }}
          REPO: ${{ github.repository }}
        run: |
          url="https://raw.githubusercontent.com/${REPO}/v${VERSION}/infra/deploy_host.sh"
          params="$(jq -n --arg url "${url}" --arg version "${VERSION}" '{
            commands: [
              "set -euo pipefail",
              "curl -fsSL \($url) -o /tmp/keel_deploy.sh",
              "bash /tmp/keel_deploy.sh \($version)"
            ],
            executionTimeout: ["3000"]
          }')"
          command_id="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "keel deploy ${VERSION}" \
            --parameters "${params}" \
            --query Command.CommandId --output text)"
          echo "SSM command ${command_id}"
          status=Pending
          for _ in $(seq 1 600); do
            status="$(aws ssm get-command-invocation \
              --command-id "${command_id}" --instance-id "${INSTANCE_ID}" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "${status}" in
              Pending|InProgress|Delayed) sleep 5 ;;
              *) break ;;
            esac
          done
          aws ssm get-command-invocation \
            --command-id "${command_id}" --instance-id "${INSTANCE_ID}" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          if [[ "${status}" != "Success" ]]; then
            echo "::error::the deploy ended with ${status}"
            exit 1
          fi
      - name: smoke test over HTTPS
        env:
          HOST: ${{ vars.KEEL_HOSTNAME }}
          VERSION: ${{ inputs.version }}
        run: |
          curl -fsS "https://${HOST}/api/health" | grep -q "\"${VERSION}\""
          curl -fsS "https://${HOST}/api/ready"
