name: deploy

# Manual, approved deploy of a released version to the Railway pilot host
# (chapter 29.9). The production environment in GitHub requires a reviewer
# before the job runs. Railway builds the Dockerfile from the tagged commit.
# For the AWS host, use deploy-aws.yml instead.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to deploy, for example 0.3.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://${{ vars.KEEL_HOSTNAME }}
    steps:
      - name: check the version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 1.2.3"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install the Railway CLI
        run: npm install --global @railway/cli
      - name: deploy the tagged commit
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service keel --ci
      - name: wait for the new version to answer
        env:
          VERSION: ${{ inputs.version }}
          HOST: ${{ vars.KEEL_HOSTNAME }}
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS "https://${HOST}/api/health" | grep -q "\"${VERSION}\""; then
              echo "version ${VERSION} is live"
              exit 0
            fi
            sleep 10
          done
          echo "the host did not report version ${VERSION} within 10 minutes"
          exit 1
      - name: smoke test
        env:
          HOST: ${{ vars.KEEL_HOSTNAME }}
        run: curl -fsS "https://${HOST}/api/ready"
