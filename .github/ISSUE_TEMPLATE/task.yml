name: Task
description: A unit of work
labels: [task]
body:
  - type: input
    id: area
    attributes:
      label: Area
      placeholder: "Retrieval"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Done when
      description: The observable evidence that closes this task
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
