    branch: feat/stage-21-deploy
    read: [docs/29_*.md chapters 29.5, 29.6, 29.9, docs/27_*.md, infra/README.md, docs/GOTCHAS.md]
    build:
      - keel bootstrap, and keel serve --bootstrap (the server starts first, the bootstrap runs in a background task, /api/ready reports the state)
      - the backup routine in the scheduler, the restore test, the data use page
      - the release through release-please, the deploy workflow run
    tests: [test_bootstrap_skips_when_present, test_backup_archive_checksum]
    done_when: A colleague uses Keel from a phone over HTTPS (in unattended mode, the deploy workflow run is started and waits for the approval).
    evidence:
      - gh workflow run deploy.yml -f version=<version>
      - curl -fsS https://<hostname>/api/health
    commits:
      - "feat(cli): bootstrap"
      - "feat(infra): scheduler backup and restore test"
      - "docs(stage-21): data use page and restore date"
    cuttable: false

