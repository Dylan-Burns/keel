    branch: feat/stage-04-index
    read: [docs/09_*.md chapters 9.4 to 9.8, docs/GOTCHAS.md]
    build:
      - keel/stores/chunk_store.py, keel/stores/sqlite_fts.py, keel/stores/numpy_dense.py
      - keel/indexer.py and `keel index` with --incremental, the manifest, the current pointer
    tests:
      - test_deterministic_build
      - test_manifest_checksums
      - test_vector_rows
      - test_lexical_known_phrase
      - test_dense_self_retrieval
      - test_incremental_add
    done_when: "`keel index` completes, and vectors.npy matches the chunk count."
    evidence:
      - uv run keel index
      - uv run keel index --incremental
      - ls -la index/current
    commits:
      - "feat(index): chunk store and FTS5 lexical index"
      - "feat(index): dense vectors with the pinned embedding model"
      - "feat(index): manifest, current pointer, incremental build"
      - "test(index): determinism and self-retrieval"
    cuttable: false
    cut_within_stage: the dense index (chapter 28 cut order, last resort); the lexical index alone must still pass the stage

