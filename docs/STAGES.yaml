# Stage cards for the build (chapter 28). One card per stage. The /stage command
# reads a card and expands it into the session prompt. The card names what to
# read, what to build, which tests must exist, and what evidence ends the stage.
# The chapters stay the specification; a card is the index into them.
#
# Fields:
#   branch      the branch name for the stage
#   read        docs to read before the stage (file globs and chapter numbers)
#   build       files to create or change
#   tests       test names that must exist and pass. A name that a chapter also
#               names (chapters 7 to 19, 26) is binding as the chapter describes
#               it. The other names (stages 10 and 12 to 22) are the minimum
#               set for stages whose chapters name no tests; add tests the
#               chapters imply.
#   done_when   the done-when evidence from the chapter 28 table
#   evidence    commands whose output goes into the PR body and the build report
#   commits     the logical commit plan, in reviewer order
#   cuttable    true when the chapter 28 cut order allows the stage to be dropped

stages:
  - id: 0
    name: Repository foundation
    branch: chore/stage-00-foundation
    read: [docs/29_*.md, docs/28_*.md, CLAUDE.md, CONTRIBUTING.md, docs/GOTCHAS.md]
    build:
      - keel/__init__.py with __version__
      - keel/cli.py with `keel --version`
      - tests/unit/test_version.py (placeholder until stage 1)
      - pylintrc (run scripts/fetch_pylintrc.sh)
      - uv.lock, web/package-lock.json
      - the front-end placeholder: web/index.html, web/src/main.tsx, web/src/App.tsx (renders the name Keel with one Motion fade and Tailwind classes), web/src/styles.css, web/src/motion/presets.ts (the pageLoad preset with its reduced twin), web/src/test-setup.ts (matchMedia stub), web/src/App.test.tsx, web/e2e/smoke.spec.ts (the title and the heading)
    tests: [test_version, App.test.tsx, smoke.spec.ts]
    done_when: >
      The CI workflow is green on the empty package and the front-end
      placeholder (both web jobs included), main is protected, and the first
      PR merged with a rebase.
    evidence:
      - uv run pre-commit run --all-files
      - make test
      - npm run check --prefix web
      - npm run test:e2e --prefix web
      - docker build -t keel:local .
      - gh pr checks
    commits:
      - "chore(stage-00): package skeleton and version command"
      - "chore(stage-00): front-end placeholder on the React stack"
      - "chore(stage-00): lockfiles and vendored pylintrc"
    cuttable: false

  - id: 1
    name: Repo skeleton, config, inventory
    branch: feat/stage-01-inventory
    read: [docs/17_*.md chapter 17.6, docs/15_*.md control S-10, docs/23_*.md, docs/07_*.md chapter 7.1, docs/19_*.md rows E-D-* on the inventory and the zip]
    build:
      - keel/config.py (pydantic-settings, KEEL_ prefix, __ nested delimiter, YAML then env)
      - keel/extractor.py (zip safety checks: path traversal, symlinks, size caps, member count)
      - keel/inventory.py and `keel inventory`
      - keel/cli.py commands inventory and doctor
      - config/companies.yaml, config/groups.yaml, config/synonyms.yaml, config/known_external.yaml, config/fiscal_year_ends.yaml, config/overrides.yaml, config/protected_names.txt, config/abbreviations.txt
      - tests/fixtures/mini_corpus (3 small filings) and tests/fixtures/snippets
    tests:
      - test_inventory_counts
      - test_manifest_mismatch
      - test_date_filter_config
      - test_filename_patterns
      - test_doctor_time_check
    done_when: >
      The counts match the corpus facts (246 files, 54 tickers, 89 10-K and
      157 10-Q, filing dates February 2022 to February 2026, 1 GE file dated
      2015), every discrepancy is stated, and assumption A-15 is recorded in
      the build report.
    evidence:
      - uv run keel inventory
      - uv run keel doctor
    commits:
      - "feat(stage-01): config loader and repo skeleton"
      - "feat(stage-01): zip extraction with safety checks and inventory"
      - "test(stage-01): inventory and config tests with the mini corpus"
      - "docs(stage-01): build report with the corpus facts and A-15"
    cuttable: false

  - id: 2
