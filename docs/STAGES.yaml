      - keel/chunker.py (token targets, overlap, SimHash, no section crossing)
    tests:
      - test_10k_properties_other
      - test_10q_mdna
      - test_10q_part_ii_risk
      - test_cross_reference_rejected
      - test_toc_rows_rejected
      - test_exhibits_excluded
      - test_nvda_item_1a_once
      - test_short_items
      - test_unknown_fallback
      - test_forward_looking_flag
      - test_table_caption
      - test_chunk_size_limits
      - test_overlap
      - test_no_section_crossing
    done_when: >
      95% of 10-Ks have the 3 core sections, and the chunk count is in the
      35,000 to 40,000 range.
    evidence:
      - uv run keel parse --all --sections-report
      - uv run keel chunk --all --summary
    commits:
      - "feat(sections): canonical section detector"
      - "feat(chunker): token chunks with overlap and simhash"
      - "test(sections): section and chunk tests from snippets"
    cuttable: false

  - id: 4
