    build:
      - keel/parsers/base.py, keel/parsers/form_10k_10q.py (the 11 checks, quarantine)
      - keel/tables.py (table rebuild, units)
      - "keel parse with --all and --summary"
    tests:
      - test_header_parse
      - test_separator_missing
      - test_xbrl_cut_at_cover
      - test_xbrl_long_block
      - test_no_xbrl_block
      - test_cover_fused_or
      - test_cover_fused_transition
      - test_fiscal_q1_apple
      - test_fiscal_q3_nvda
      - test_nominal_month
      - test_registrant_mismatch
      - test_fused_items
      - test_nbsp_item_label
      - test_heading_split
      - test_page_artifact
      - test_protected_name
      - test_table_units
      - test_idempotent_ids
      - test_giant_line_parse
      - test_large_file_parse_time
      - test_bom_and_crlf
      - test_invalid_utf8
      - test_truncated_file_quarantine
      - test_duplicate_filing_id
    done_when: All 246 files parse, GE is quarantined, the 18 parser tests of chapter 7 pass, and the chapter 19 rows on the card have their tests.
    evidence:
      - uv run keel parse --all --summary
      - uv run pytest tests/unit/test_parser.py -q
    commits:
      - "feat(parser): header, separator, and XBRL cut"
      - "feat(parser): cover page period, fiscal math, and quarantine"
      - "feat(parser): table rebuild with units"
      - "test(parser): snippets for the 11 checks"
    cuttable: false

