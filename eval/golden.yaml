# The golden set of chapter 18.1: 28 questions with their expected sources.
#
# Version rule (chapter 17.12): minor for added questions, major for changed
# expected sources. The filing IDs were resolved from the index named below
# (the `filings` table), never from a file name. The fiscal period is the
# label of the index (fiscal_year and fiscal_period of the filing).
#
# Fields of a question:
#   type: single_company, comparison, trend, numeric, sector,
#     out_of_corpus, ambiguous_entity, or adversarial (chapter 18.1).
#   labels: chunk (graded chunk labels in eval/labels/, chapter 18.2) or
#     section (every chunk of the expected filing and section pairs).
#   expect_out_of_scope: true when the right response is the out-of-scope
#     response with no retrieval and no model call.
#   answer_only: true when the question tests the answer alone (G-28 runs
#     on a fixture context, not on the index).
#   subsets: tags for `keel eval --subset`; `ci` runs on the mini corpus
#     index of the eval workflow, `demo` holds the 3 example questions,
#     `chunk` the 10 questions with chunk-level labels.
#   gold: the gold value of a numeric question, read from the named chunk.
