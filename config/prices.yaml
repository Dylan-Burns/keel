# Model prices in USD per 1 million tokens, from the provider price page
# (platform.claude.com/docs/en/about-claude/pricing) on checked_on.
checked_on: "2026-10-21"
models:
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    cache_read: 0.10           # 0.05x the base input price on Sonnet 5.5
    cache_write: 2.50          # 5-minute cache write
  claude-haiku-5-5:
    input: 0.10                # prompts up to 100,000 tokens
    output: 0.50
    cache_read: 0.01
    cache_write: 0.125
    long_prompt_threshold: 100000
    long_prompt:               # every price for a prompt over the threshold
      input: 0.50
      output: 2.50
      cache_read: 0.05
      cache_write: 0.625
  claude-opus-5-5:             # the eval judge (D-35)
    input: 4.00
    output: 20.00
    cache_read: 0.20
    cache_write: 5.00
