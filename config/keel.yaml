# Keel configuration. Secrets never live in this file.
#
# Environment overrides: a top-level key is KEEL_<KEY>, a nested key is
# KEEL_<SECTION>__<KEY> (two underscores). Examples: KEEL_OFFLINE=1,
# KEEL_LLM__MODEL=..., KEEL_INDEX__DIR=/data/index. List values are JSON.
# The placeholders were resolved at stage 0 (docs/BUILD_REPORT.md).

offline: false                 # KEEL_OFFLINE=1 serves every question from the answer cache (chapter 16)

server:
  host: 127.0.0.1              # KEEL_SERVER__HOST=0.0.0.0 in the container
  port: 8000

cache:
  answers_dir: demo/answer_cache   # the answer cache; committed for the offline drill, on the volume in the pilot

corpus:
  zip: corpus/edgar_corpus.zip
  url: null                    # KEEL_CORPUS__URL: where `keel bootstrap` downloads the zip when it is absent
  dir: corpus/edgar
  manifest: corpus/edgar/manifest.json
  date_filter: null            # or {min: "2023-01-01", max: "2025-12-31"}; decision D-19 keeps all files

index:
  dir: index                   # the build writes index/<build_id> and moves the `current` pointer

logs:
  dir: logs                    # audit.jsonl, refresh.log

parser:
  version: 1.0.0
  protected_names: config/protected_names.txt
  abbreviations: config/abbreviations.txt
  overrides: config/overrides.yaml
  fiscal_year_ends: config/fiscal_year_ends.yaml

dictionaries:
  companies: config/companies.yaml       # 1 entry per ticker: legal name, aliases, groups (chapter 10.2)
  groups: config/groups.yaml             # sector groups and trigger phrases (chapter 10.3)
  synonyms: config/synonyms.yaml         # topic word expansion for FTS5 (chapter 9.3)
  known_external: config/known_external.yaml  # well-known companies outside the corpus (chapter 10.6)

chunker:
  version: 1.0.0
  target_tokens: 400
  max_tokens: 480
  overlap_tokens: 50

embedding:
  model: BAAI/bge-small-en-v1.5
  revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a  # pinned commit on Hugging Face
  batch_size: 32

reranker:
  enabled: true
  model: cross-encoder/ms-marco-MiniLM-L6-v2  # the Hub renamed ms-marco-MiniLM-L-6-v2 to this id
  revision: 233902d25c440f23af6f7d6e94d2946bac0bee0a  # pinned commit on Hugging Face
  top_n: 80

retrieval:
  lexical_k: 100
  dense_k: 100
  rrf_k: 60
  max_context_tokens: 32000
  max_chunks: 48
  simhash_max_distance: 3
  calibration_factor: 1.91      # keel calibrate, stage 8: 200 chunks, 109,680 counted tokens (default 1.15)

llm:
  provider: anthropic
  model: claude-sonnet-5-5     # Claude Sonnet 5.5; the models list has no dated id for 5.5
  fallback_model: claude-haiku-5-5  # Claude Haiku 5.5
  judge_model: claude-opus-5-5  # eval only; a different model from llm.model (D-35)
  prices: config/prices.yaml   # USD per 1 million tokens, keyed by model id
  temperature: null             # D-12 asks for 0; the 5.5 models reject the parameter (build report, stage 7)
  thinking:                    # the lowest thinking setting per model; the answer is 1 tool call
    claude-sonnet-5-5: between_tools
    claude-haiku-5-5: disabled
  max_output_tokens: 8000      # D-12 says 4,000; the strict JSON answer needs about 2.2 characters per token (stage 7)
  prompt_version: 1.0.0
  prompts_dir: prompts         # answer_system, answer_user, answer_schema per version
  cache_system_block: true
  timeout_seconds: 120         # the whole request (chapter 16.1)
  connect_timeout_seconds: 10
  idle_timeout_seconds: 30     # the gap between 2 stream events
  max_retries: 2               # before any content only (D-04)

limits:
  question_min_chars: 3
  question_max_chars: 1000
  rate_per_minute: 10
  rate_per_hour: 100
  daily_budget_usd: 20

edgar:
  user_agent: "Dylan Burns dylanburns1524@gmail.com"  # as the SEC requires
  cache_dir: cache/edgar
  min_request_interval_seconds: 0.2

demo:
  example_questions:
    - "What are the primary risk factors facing Apple, Tesla, and JPMorgan, and how do they compare?"
    - "How has NVIDIA's revenue and growth outlook changed over the last two years?"
    - "What regulatory risks do the major pharmaceutical companies face, and how are they addressing them?"
  add_companies: ["ZTS", "WDAY"]  # 2 tickers outside the corpus for keel add (chapter 26.6)

scheduler:
  enabled: false               # KEEL_SCHEDULER__ENABLED=1 on Railway (chapter 29.9); systemd timers on the AWS host
  refresh_at: "02:00"
  backup_at: "02:30"
  backup_bucket: null          # KEEL_SCHEDULER__BACKUP_BUCKET: S3-compatible bucket for the nightly archive

deploy:
  host: railway                # railway (default, chapter 29.9), aws (chapter 29.6), or a hostname
