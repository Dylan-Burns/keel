# Keel configuration. Secrets never live in this file.
#
# Environment overrides: a top-level key is KEEL_<KEY>, a nested key is
# KEEL_<SECTION>__<KEY> (two underscores). Examples: KEEL_OFFLINE=1,
# KEEL_LLM__MODEL=..., KEEL_INDEX__DIR=/data/index. List values are JSON.

offline: false                 # KEEL_OFFLINE=1 serves every question from the answer cache

server:
  host: 127.0.0.1              # KEEL_SERVER__HOST=0.0.0.0 in the container
  port: 8000                   # `keel serve` takes the next free port up to 8010 (E-F-08)
  web_dist: web/dist           # the front-end build that the service serves at /
  eval_report: eval/report.md  # GET /api/eval renders it read-only (W-02); `keel eval` writes it
  prompt_log: docs/PROMPT_LOG.md  # GET /api/eval renders it read-only next to the report (W-02)

cache:
  answers_dir: demo/answer_cache   # the answer cache; committed for the offline drill, on the volume in the pilot

corpus:
  zip: corpus/edgar_corpus.zip
  url: null                    # KEEL_CORPUS__URL: where `keel bootstrap` downloads the zip when it is absent
  release_repo: Dylan-Burns/keel   # `gh release download` source when GH_TOKEN is set
  release_tag: corpus-v1
  dir: corpus/edgar
  manifest: corpus/edgar/manifest.json
  date_filter: null            # or {min: "2023-01-01", max: "2025-12-31"}; decision D-19 keeps all files

index:
  dir: index                   # the build writes index/<build_id> and moves the `current` pointer
  release_tag: null            # KEEL_INDEX__RELEASE_TAG=index-v1: bootstrap restores this release archive instead of building
  url: null                    # KEEL_INDEX__URL: https URL of the index archive; its .sha256 sits beside it (an unsigned public URL)

logs:
  dir: logs                    # audit.jsonl, refresh.log, state.sqlite (the watch list, 26.3)

parser:
  version: 1.0.0
  protected_names: config/protected_names.txt
  abbreviations: config/abbreviations.txt
  overrides: config/overrides.yaml
  fiscal_year_ends: config/fiscal_year_ends.yaml

dictionaries:
  companies: config/companies.yaml       # 1 entry per ticker: legal name, aliases, groups
  groups: config/groups.yaml             # sector groups and trigger phrases
  synonyms: config/synonyms.yaml         # topic word expansion for FTS5
  known_external: config/known_external.yaml  # well-known companies outside the corpus

chunker:
  version: 1.0.0
  target_tokens: 400
  max_tokens: 480
  overlap_tokens: 50

embedding:
  model: BAAI/bge-small-en-v1.5
  revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a  # pinned commit on Hugging Face
  batch_size: 32

reranker:
  enabled: true
  model: cross-encoder/ms-marco-MiniLM-L6-v2  # the Hub renamed ms-marco-MiniLM-L-6-v2 to this id
  revision: 233902d25c440f23af6f7d6e94d2946bac0bee0a  # pinned commit on Hugging Face
  top_n: 80                    # D-10: at most 80 pairs per question
  max_length: 384              # tokens per pair (model 512): rerank -20%, recall@25 -0.001 on the t3.large host
  threads: 0                   # torch threads, 0 = 1 per usable CPU (torch default: 1 per core): rerank -20% on 2 vCPUs
  batch_size: 8                # pairs per predict call (default 32): less padding per batch

retrieval:
  lexical_k: 100
  dense_k: 100
  rrf_k: 60
  max_context_tokens: 32000
  max_chunks: 48
  simhash_max_distance: 3
  calibration_factor: 1.91      # keel calibrate: 200 chunks, 109,680 counted tokens (default 1.15)

llm:
  provider: anthropic
  model: claude-sonnet-5-5     # Claude Sonnet 5.5; the models list has no dated id for 5.5
  fallback_model: claude-haiku-5-5  # Claude Haiku 5.5
  judge_model: claude-opus-5-5  # eval only; a different model from llm.model (D-35)
  prices: config/prices.yaml   # USD per 1 million tokens, keyed by model id
  temperature: null             # D-12 asks for 0; the 5.5 models reject the parameter (measured)
  thinking:                    # the lowest thinking setting per model; no thinking before the answer
    claude-sonnet-5-5: between_tools
    claude-haiku-5-5: disabled
  max_output_tokens: 8000      # D-12 says 4,000; the strict JSON answer needs about 2.2 characters per token
  output_mode: json_schema     # D-13: structured output (output_config.format); `tool` is the strict answer tool
  prompt_version: 1.5.1        # docs/PROMPT_LOG.md; 1.3.0 to 1.5.1 pair with json_schema, 1.0.0 to 1.2.0 with tool
  prompts_dir: prompts         # answer_system, answer_user, answer_schema per version
  cache_system_block: true
  timeout_seconds: 120         # the whole request
  connect_timeout_seconds: 10
  idle_timeout_seconds: 30     # the gap between 2 stream events
  max_retries: 2               # before any content only (D-04)

limits:
  question_min_chars: 3
  question_max_chars: 1000
  rate_per_minute: 30   # raised from 10 for the demo: 1 bucket per named user
  rate_per_hour: 300    # raised from 100 for the demo
  daily_budget_usd: 20

auth:
  users_file: config/users.yaml  # name, role, token hash; `keel users add`; /data/users.yaml in the pilot
  public: false                # true on the public site (KEEL_AUTH__PUBLIC=1 in docker-compose.yml): visitors ask with their own Anthropic key (X-Anthropic-Api-Key) or read the answer cache; admins keep their tokens

pilot:
  db: null                     # comp sets and feedback; null is pilot.sqlite in logs.dir
  templates: config/templates.yaml  # the 5 question templates of the web picker

edgar:
  user_agent: "Dylan Burns dylanburns1524@gmail.com"  # as the SEC requires
  cache_dir: cache/edgar
  min_request_interval_seconds: 0.2
  facts: config/facts.yaml     # the 8 company facts concepts and their XBRL names
  sic_codes: config/sic_codes.yaml  # the SEC industries of the admin company browser
  directory_ttl_days: 30       # the company list of an industry is fetched again after this
  directory_since_year: 2022   # the browser shows companies with a 10-K or 10-Q every year since
  financials: config/financials.yaml  # the statements of the financials page and their XBRL names

demo:
  example_questions:
    - "What are the primary risk factors facing Apple, Tesla, and JPMorgan, and how do they compare?"
    - "How has NVIDIA's revenue and growth outlook changed over the last two years?"
    - "What regulatory risks do the major pharmaceutical companies face, and how are they addressing them?"
  add_companies: ["ZTS", "WDAY"]  # 2 tickers outside the corpus for keel add

scheduler:
  enabled: false               # in-process scheduler; the AWS host uses systemd timers instead
  refresh_at: "02:00"
  backup_at: "02:30"
  backup_bucket: null          # KEEL_SCHEDULER__BACKUP_BUCKET: S3-compatible bucket for the nightly archive
  backup_dir: backups          # local archives; /app/state/backups in docker-compose.yml
  backup_keep: 7               # local archives kept

eval:
  report_dir: null             # the admin eval job writes <run id>.md and .json here; null is <logs.dir>/eval (writable on the host)

deploy:
  host: railway                # railway (D-41, infra/README.md) or aws (D-39, infra/terraform)
