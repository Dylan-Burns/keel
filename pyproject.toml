[project]
name = "keel"
version = "0.8.0"
description = "Grounded answers to business questions about SEC filings from one LLM call."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
authors = [{ name = "Dylan Burns" }]
keywords = ["rag", "sec", "edgar", "10-k", "10-q", "private-equity"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]
dependencies = [
  "anthropic>=0.40",
  "fastapi>=0.115",
  "httpx>=0.27",
  # Intel macOS: torch stops at 2.2.2, which needs numpy 1.x (decision log).
  "numpy>=2.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "numpy>=1.26,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "pyyaml>=6.0",
  "rapidfuzz>=3.9",
  "sentence-transformers>=3.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "sentence-transformers>=3.0,<4; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "transformers>=4.41,<4.48; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "torch>=2.4; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "uvicorn[standard]>=0.30",
]

# CPU-only PyTorch wheels (docs/GOTCHAS.md). The CUDA wheels add gigabytes
# that the image, CI, and the cloud session never use.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'darwin' or platform_machine != 'x86_64'" },
]

[project.optional-dependencies]
export = ["python-docx>=1.1"]

[project.scripts]
keel = "keel.cli:main"

[project.urls]
Documentation = "docs/01_reader_map_and_executive_summary.md"

[dependency-groups]
dev = [
  "hypothesis>=6.112",
  "mypy>=1.11",
  "pip-audit>=2.7",
  "pre-commit>=3.8",
  "pylint>=3.2",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["keel"]

# Google Python Style Guide: 80 columns, 4-space indent, Google docstrings,
# PEP 8 names, one import per line, standard library then third party then
# first party. ruff enforces what it can; pylint with Google's pylintrc runs
# in CI as the second opinion; the module-import rule is enforced in review.
[tool.ruff]
line-length = 80
target-version = "py312"
src = ["keel", "tests", "eval", "scripts"]
extend-exclude = ["corpus", "index", "cache", "docs", "web/node_modules", "web/dist"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "D",         # pydocstyle, Google convention below
  "ANN",       # type annotations on public functions
  "B",         # bugbear
  "UP",        # pyupgrade
  "S",         # bandit
  "C4",        # comprehensions
  "SIM",       # simplify
  "PT",        # pytest style
  "RET",       # return consistency
  "RUF",       # ruff specific
  "T20",       # no print in library code
  "ERA",       # no commented-out code
  "PL",        # pylint subset
]
ignore = [
  "D105",      # magic method docstrings
  "D107",      # __init__ docstrings; the class docstring covers it
  "PLR0913",   # many arguments: config objects are passed explicitly
  "PLR2004",   # magic values: thresholds are named in config tables instead
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["keel"]
force-sort-within-sections = true
case-sensitive = false
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ANN", "PLR"]
"eval/**" = ["T20", "D"]
"scripts/**" = ["T20", "D"]
"keel/cli.py" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
no_implicit_optional = true
show_error_codes = true
pretty = true
files = ["keel"]

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "rapidfuzz.*", "docx.*", "tokenizers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "unit: fast tests on snippets and pure functions",
  "integration: tests on the mini corpus and the API with the mock provider",
  "eval: tests that need the full index or the live provider",
]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:keel.*"]

[tool.coverage.run]
source = ["keel"]
branch = true
omit = ["keel/cli.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
